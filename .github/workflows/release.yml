name: Yocto Optologic Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-torizon-optologic-binaries:
    uses: ./.github/workflows/torizon-optologic-binary.yml

  release-yocto-optologic:
    name: Tag and release meta-optologic
    runs-on: [ubuntu-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout meta-optologic
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$tag" ]; then
              echo "No existing tag found"
              tag=""
          fi

          echo "latest_tag=$tag" >> $GITHUB_OUTPUT

      - name: Check for new commits since last tag
        id: check_changes
        run: |
          if [ -z "${{ steps.latest_tag.outputs.latest_tag }}" ]; then
            exit 0
          fi

          commits=$(git rev-list ${{ steps.latest_tag.outputs.latest_tag }}..HEAD --count)

          if [ "$commits" -eq 0 ]; then
            echo "No new commits since last tag ${{ steps.latest_tag.outputs.latest_tag }}, no need for a new tag and release."
            exit 1
          fi

      - name: Read Toradex tag
        id: toradex
        run: |
          TAG=$(grep -oP 'TORADEX_TAG:\s*\K.*' .github/workflows/yocto-toradex-optologic-ci.yml)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate tag
        id: tag
        run: |
          BASE="toradex-bsp-${{ steps.toradex.outputs.tag }}-optologic"

          existing=$(git tag -l "${BASE}-*")
          if [ -z "$existing" ]; then
            version="1.0"
          else
            last=$(echo "$existing" | sed "s/${BASE}-//" | sort -V | tail -n1)

            major=$(echo $last | cut -d. -f1)
            minor=$(echo $last | cut -d. -f2)

            minor=$((minor + 1))
            version="${major}.${minor}"
          fi

          new_tag="${BASE}-${version}"

          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "Generated tag: $new_tag"

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      - name: Get Torizon Optologic binary images
        uses: actions/download-artifact@v8
        with:
          name: 'torizon-docker-*-5inch-SCX0500132GGC06-Tezi.tar'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: '*'
