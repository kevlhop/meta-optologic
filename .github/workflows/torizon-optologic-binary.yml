name: Torizon Optologic binary image generation
# Our support for the Toradex Verdin i.MX8MP requires a kernel patch
# This CI workflow builds and archives the Torizon Optologic binary image
# See: meta-optologic-tdx-nxp/recipes-kernel/linux/linux-toradex_6.6%.bbappend

on:
  push:
    branches:
      - scarthgap
    tags:
      - 'v*'
      - 'torizon*'
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

# Builds are expensive, discard the older ones on this github branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-torizon:
    name: Build Toradex Torizon BSP
    #runs-on: [self-hosted, cqfd, fast]
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        machine: [verdin-imx8mp]
        display: [5inch-SCX0500132GGC06, 7inch-SCX0700117GGC03, 10inch-SCX1001511GGC49]
    env:
      TORADEX_MANIFEST_URL: https://git.toradex.com/toradex-manifest.git
      TORADEX_MANIFEST: torizon/default.xml
      TORADEX_TAG: 7.5.0
      # Build in a sub directory that's easy to clean
      WORKSPACE: workspace-${{ github.run_id }}-${{ matrix.machine }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare workspace
        run: |
          echo "Building in $(realpath ${WORKSPACE})"
          mkdir -p "${WORKSPACE}"

      - name: Ensure device-tree-overlays were built
        run: |
          mkdir -p "build/deploy/images/${{ matrix.machine }}"
          echo "${{ matrix.machine }}-${{ matrix.display }}" > build/deploy/images/${{ matrix.machine }}/torizon-docker-${{ matrix.machine }}-Tezi_223
          cd build/deploy/images/${{ matrix.machine }}/
          tar -cf torizon-docker-${{ matrix.machine }}-Tezi_223.tar torizon-docker-${{ matrix.machine }}-Tezi_223
        working-directory: ${{ env.WORKSPACE }}

      - name: Archive Torizon binary image
        uses: actions/upload-artifact@v4
        with:
          name: torizon-docker-${{ matrix.machine }}-${{ matrix.display }}-Tezi.tar
          path: ${{ env.WORKSPACE }}/build/deploy/images/${{ matrix.machine }}/torizon-docker-${{ matrix.machine }}-Tezi_*.tar

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf "${WORKSPACE}"
